name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: ['20', '22', '24']
        include:
          - os: windows-latest
            node-version: '22'
          - os: macos-latest
            node-version: '22'
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run Vitest
        run: npm run test

      - name: CLI smoke test
        shell: bash
        run: |
          node bin/unorm.js --version
          echo "한글" | node bin/unorm.js -f NFD | node bin/unorm.js -f NFC
          echo "한글" | node bin/unorm.js -f NFD | node bin/unorm.js
